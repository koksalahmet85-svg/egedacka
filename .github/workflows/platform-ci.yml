name: platform-ci

on:
  push:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: egealfa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/egealfa
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: prisma generate
      - run: ruff check app tests && ruff format --check app tests
      - run: prisma migrate deploy
      # Şema ile migration'lar arasında drift olmamalı
      - run: prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: python -m app.seed --athletes 750
      - run: RUN_INTEGRATION=1 pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
